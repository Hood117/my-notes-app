<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Notes – Minimalist Note Taking & Collaborative Workspace</title>
    
    <!-- Primary Meta Tags -->
    <meta
      name="description"
      content="Capture thoughts, organize tasks, and collaborate seamlessly in real time with My Notes. A minimal, fast, and tactile productivity workspace."

      name="keywords"
      content="notes app, markdown notes, collaborative workspace, productivity, note taking, digital notebook, task manager, rich text editor"
    />
    <meta name="author" content="My Notes" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Notes" />
    <meta property="og:title" content="My Notes – Minimalist Note Taking & Collaborative Workspace" />
    <meta
      property="og:description"
      content="Capture thoughts, organize tasks, and collaborate seamlessly in real time with My Notes. A minimal, fast, and tactile productivity workspace."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Notes – Minimalist Note Taking & Collaborative Workspace" />
    <meta
      name="twitter:description"
      content="Capture thoughts, organize tasks, and collaborate seamlessly in real time with My Notes. A minimal, fast, and tactile productivity workspace."
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "My Notes",
        "alternateName": "MyNoteSpace",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "All",
        "description": "Capture thoughts, organize tasks, and collaborate seamlessly in real time with My Notes. A minimal, fast, and tactile productivity workspace.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
